image: docker:24.0.5

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  GHCR_IMAGE: ghcr.io/thirdshop-org/dokvol

services:
  - name: docker:24.0.5-dind
    command: ["--insecure-registry", "gitlab.thirdshop.fr:5050"]

stages:
  - test
  - build
  - publish

test:
  stage: test
  script:
    - DOCKER_BUILDKIT=0 docker build -f Dockerfile.test -t sut-test .
    - docker run --privileged -v /dev:/dev -e DOKVOL_DB_PATH=/tmp/dokvol-test.db sut-test
  variables:
    DOKVOL_DB_PATH: /tmp/dokvol-test.db
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build:
  stage: build
  script:
    - echo "$GHCR_PASSWORD" | docker login -u "$GHCR_USERNAME" --password-stdin ghcr.io
    - docker build -t "$GHCR_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$GHCR_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish:
  stage: publish
  script:
    - echo "$GHCR_PASSWORD" | docker login -u "$GHCR_USERNAME" --password-stdin ghcr.io
    - docker pull "$GHCR_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      TAGS="$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        MINOR="${VERSION%.*}"
        MAJOR="${VERSION%%.*}"
        for V in "$VERSION" "$MINOR" "$MAJOR"; do
          TAGS="$TAGS $V"
        done
      fi
      for tag in $TAGS; do
        docker tag "$GHCR_IMAGE:$CI_COMMIT_SHORT_SHA" "$GHCR_IMAGE:$tag"
        docker push "$GHCR_IMAGE:$tag"
      done
    - |
      if [ -n "$CI_REGISTRY" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" || true
        for tag in $TAGS; do
          docker tag "$GHCR_IMAGE:$tag" "$CI_REGISTRY_IMAGE:$tag" || true
          docker push "$CI_REGISTRY_IMAGE:$tag" || echo "⚠️ GitLab Registry: $tag non poussé"
        done
      fi
  needs:
    - job: build
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
